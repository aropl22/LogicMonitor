- task: PythonScript@0
  displayName: 'Download LogicMonitor Dashboards'
  inputs:
    scriptSource: 'filePath'
    scriptPath: '$(Build.SourcesDirectory)/download_dashboards.py'
    workingDirectory: '$(Build.SourcesDirectory)'
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
    DASHBOARD_DAYS: '100'
    OUTPUT_DIR: $(Build.ArtifactStagingDirectory)

- task: PublishPipelineArtifact@1
  displayName: 'Publish Dashboard JSON Files'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'lm-dashboards'
    publishLocation: 'pipeline'